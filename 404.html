<!doctype html>
<html lang="it" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pagina non trovata | 17Labs</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0d11" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f1ec" media="(prefers-color-scheme: light)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='3' fill='%230b0d11'/%3E%3Crect x='3.5' y='3.5' width='25' height='25' rx='1.5' fill='none' stroke='%23333c4b'/%3E%3Cg fill='%23d9a441'%3E%3Crect x='9' y='10' width='2.5' height='12'/%3E%3Crect x='9' y='10' width='6' height='2.5'/%3E%3Crect x='17' y='10' width='7' height='2.5'/%3E%3Crect x='19' y='12.5' width='2.5' height='9.5'/%3E%3C/g%3E%3C/svg%3E">
<!-- ============================================================
     Questa pagina e' volutamente autonoma: nessun foglio di stile
     esterno, nessun carattere da scaricare, nessuno script.
     GitHub Pages la serve per qualsiasi indirizzo inesistente, a
     qualunque profondita' — /a/b/c/nonesiste — e i percorsi
     relativi degli asset, da li', punterebbero nel vuoto.
     ============================================================ -->
<style>
  :root {
    --bg: #0b0d11; --surface: #13171e; --line: #232935; --line-2: #333c4b;
    --text: #e9ecf1; --dim: #a6aebb; --acc: #d9a441; --acc-ink: #0b0d11;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f3f1ec; --surface: #fbfaf7; --line: #d9d4ca; --line-2: #b2ab9d;
      --text: #15181e; --dim: #474e59; --acc: #8a5a00; --acc-ink: #fbfaf7;
      color-scheme: light;
    }
  }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100svh; display: grid; place-items: center;
    padding: 40px 24px; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.68; -webkit-font-smoothing: antialiased;
  }
  main { max-width: 54ch; text-align: center; }
  .code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: clamp(56px, 13vw, 116px); font-weight: 500; line-height: 1;
    letter-spacing: -0.04em; color: var(--acc); margin-bottom: 18px;
  }
  h1 { font-size: clamp(21px, 3.4vw, 28px); font-weight: 600; letter-spacing: -0.02em; margin: 0 0 12px; }
  p { color: var(--dim); font-size: 15.5px; margin: 0 0 10px; }
  .en { font-size: 14px; opacity: .8; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 28px; }
  a.btn {
    display: inline-flex; align-items: center; gap: 9px; padding: 13px 22px;
    border: 1px solid var(--line-2); border-radius: 2px; text-decoration: none;
    color: var(--text); background: transparent;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px; letter-spacing: .1em; text-transform: uppercase;
    transition: border-color .2s, color .2s;
  }
  a.btn:hover { border-color: var(--acc); color: var(--acc); }
  a.primary { background: var(--acc); border-color: var(--acc); color: var(--acc-ink); }
  a.primary:hover { color: var(--acc-ink); }
  hr { border: 0; border-top: 1px solid var(--line); margin: 26px 0 20px; }
</style>
</head>
<body>
<main>
  <p class="code">404</p>
  <h1>Questa pagina non esiste</h1>
  <p>L'indirizzo e' sbagliato oppure la pagina e' stata spostata. Nessun danno: il resto del sito e' al suo posto.</p>
  <hr>
  <p class="en" lang="en"><strong>Page not found.</strong> The address is wrong or the page has moved. No harm done — the rest of the site is where it should be.</p>
  <div class="row">
    <a class="btn primary" href="/">Torna al sito</a>
    <a class="btn" href="/en/" hreflang="en" lang="en">English version</a>
  </div>
</main>
</body>
</html>
